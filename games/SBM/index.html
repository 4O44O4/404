<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<script>
window.GoogleIMA = {};

window.PokiSDK = {
  init: () => Promise.resolve(),
  commercialBreak: () => Promise.resolve(true),
  rewardedBreak: () => Promise.resolve(true),
  gameplayStart: () => {},
  gameplayStop: () => {},
  happyTime: () => Promise.resolve(true),
  roundEnd: () => {},
  displayAd: () => Promise.resolve(true),
};

window.adBreak = (o = {}) => {
  try {
    if (o.beforeAd) o.beforeAd();
    if (o.beforeReward) o.beforeReward();

    setTimeout(() => {
      if (o.adViewed) o.adViewed();
      if (o.adFinished) o.adFinished();
      if (o.afterAd) o.afterAd();
      if (o.adBreakDone) o.adBreakDone();
      if (o.complete) o.complete();
      if (o.done) o.done();
    }, 300);
  } catch(e) {}
};

window.showAds = (cb) => {
  setTimeout(() => {
    if (cb) cb(true);
  }, 300);
};

window.showAd = (cb) => {
  setTimeout(() => {
    if (cb) cb(true);
  }, 300);

  return Promise.resolve(true);
};

window.requestAds = () => Promise.resolve(true);
window.rewardedAd = () => Promise.resolve(true);
window.revive = () => true;

window.adsbygoogle = [];

window.gdsdk = {
  init: () => Promise.resolve(),
  showAd: () => Promise.resolve(true),
};
</script>

<embed id="game" src="medvedi.swf">

<script>
window.addEventListener("click", () => {
  const elem = document.documentElement;

  if (!document.fullscreenElement) {
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }
  }
}, { once: true });
</script>

</body>
</html>
