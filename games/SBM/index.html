<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<script>
const rewardResult = {
  success: true,
  completed: true,
  rewardGranted: true,
  adViewed: true,
  finished: true,
  hasReward: true,
  cancelled: false,
  error: null
};

function finishAd(obj = {}) {
  try {
    const funcs = [
      "beforeAd",
      "beforeReward",
      "adStarted",
      "adViewed",
      "adFinished",
      "afterAd",
      "adBreakDone",
      "complete",
      "done",
      "onComplete",
      "onSuccess",
      "onReward",
      "reward",
      "rewardGranted",
      "callback",
      "finish"
    ];

    funcs.forEach(name => {
      if (typeof obj[name] === "function") {
        try {
          obj[name](rewardResult);
        } catch(e) {}
      }
    });
  } catch(e) {}
}

window.GoogleIMA = {};
window.google = window.google || {};
window.google.ima = {};

window.adsbygoogle = [];

window.PokiSDK = {
  init: () => Promise.resolve(rewardResult),
  commercialBreak: () => Promise.resolve(rewardResult),
  rewardedBreak: () => Promise.resolve(rewardResult),
  gameplayStart: () => {},
  gameplayStop: () => {},
  happyTime: () => Promise.resolve(rewardResult),
  roundEnd: () => {},
  displayAd: () => Promise.resolve(rewardResult),
  shareableURL: () => "",
};

window.gdsdk = {
  init: () => Promise.resolve(rewardResult),
  preloadAd: () => Promise.resolve(rewardResult),
  showAd: () => Promise.resolve(rewardResult),
};

window.CrazyGames = {
  SDK: {
    init: () => Promise.resolve(rewardResult),
    ad: {
      requestAd: (_, callbacks = {}) => {
        setTimeout(() => {
          if (callbacks.adFinished) callbacks.adFinished();
          if (callbacks.adViewed) callbacks.adViewed();
        }, 300);
      }
    }
  }
};

window.GameAPI = {
  GameBreak: {
    request: (fn) => {
      if (fn) setTimeout(fn, 300);
    }
  }
};

window.adBreak = (o = {}) => {
  finishAd(o);
};

window.showAds = (cb) => {
  setTimeout(() => {
    if (cb) cb(rewardResult);
  }, 300);

  return Promise.resolve(rewardResult);
};

window.showAd = (cb) => {
  setTimeout(() => {
    if (cb) cb(rewardResult);
  }, 300);

  return Promise.resolve(rewardResult);
};

window.showRewardedAd = (cb) => {
  setTimeout(() => {
    if (cb) cb(rewardResult);
  }, 300);

  return Promise.resolve(rewardResult);
};

window.requestAds = () => Promise.resolve(rewardResult);
window.rewardedAd = () => Promise.resolve(rewardResult);
window.revive = () => true;
window.playAds = () => Promise.resolve(rewardResult);
window.sdkShowAd = () => Promise.resolve(rewardResult);

window.UnityAds = {
  init: () => {},
  show: () => Promise.resolve(rewardResult)
};

window._azerionJGSDK = {
  showAd: () => Promise.resolve(rewardResult)
};

window.YaGames = {
  init: () => Promise.resolve({
    adv: {
      showFullscreenAdv: (o = {}) => finishAd(o),
      showRewardedVideo: (o = {}) => finishAd(o)
    }
  })
};
</script>

<embed id="game" src="medvedi.swf">

<script>
window.addEventListener("click", () => {
  const elem = document.documentElement;

  if (!document.fullscreenElement) {
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }
  }
}, { once: true });
</script>

</body>
</html>
